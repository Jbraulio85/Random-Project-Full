services:
  mongo:
    image: mongo:latest
    container_name: mongo_random_container
    networks:
      - random-project
    volumes:
      - mongo-data:/data/db
    ports:
      - "27018:27017"

  server:
    build: ./server
    container_name: server_container
    depends_on:
      - mongo
    environment:
      - URI_MONGO=mongodb://mongo:27017/randomproyect
    ports:
      - "3002:3000"
    networks:
      - random-project
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  client:
    build: ./client
    container_name: client_container
    ports:
      - "4173:4173"
    networks:
      - random-project
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - random-project
    depends_on:
      - client
      - server
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  random-project:
    driver: bridge

volumes:
  mongo-data:
    driver: local
